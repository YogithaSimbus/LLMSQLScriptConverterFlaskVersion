<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SQLSwitch Converter</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">

</head>


<body data-theme="{{ theme }}">

<div class="glass-bg"></div>

<div class="app-shell">


    <!-- HEADER -->
    <header class="main-header">

        <div class="logo-area">

            <img src="https://upload.wikimedia.org/wikipedia/commons/6/63/Databricks_Logo.png"
                 alt="Databricks">

            <span class="logo-label">
                Powered by Databricks
            </span>

        </div>


        <div class="brand-area">

            <h1 class="hero-title">

                SQLSwitch Converter

            </h1>


            <div class="header-actions">


                <div class="user-status"
                     id="system-status">

                    System Ready

                </div>

            </div>

        </div>

    </header>



    <!-- MAIN GRID -->
    <main class="bento-grid">


        <!-- CONFIG CARD -->
        <section class="bento-item config-card">

            <div class="card-header">

                <h3>
                    ⚙️ Environment Settings
                </h3>

            </div>


            <form id="config-form"
                  class="smart-form">


                <div class="input-group">

                    <label>Dialect</label>

                    <select name="source_dialect">

                        <option value="mssql">
                            MSSQL
                        </option>
                        
                        <option value="teradata">
                            Terradata
                        </option>

                        <option value="snowflake">
                            Snowflake
                        </option>

                    </select>

                </div>



                <div class="input-group">

                    <label>Catalog</label>

                    <input type="text"
                           name="catalog"
                           value="lakebridge">

                </div>



                <div class="input-group">

                    <label>Schema</label>

                    <input type="text"
                           name="schema"
                           value="switch">

                </div>



                <div class="input-group">

                    <label>Foundation Model</label>

                    <select name="model_choice">

                        <option value="databricks-meta-llama-3-3-70b-instruct">
                            databricks-meta-llama-3-3-70b-instruct (Recommended)
                        </option>

                        

                    </select>

                </div>


            </form>

        </section>



        <!-- UPLOAD SECTION -->
        <div class="upload-wrapper">


            <!-- SQL FILE UPLOAD -->
            <div class="bento-item upload-zone">

                <div class="upload-icon">
                    📄
                </div>

                <h4>
                    Single / Multiple SQL Files
                </h4>

                <p>
                    Supported: .sql, .bteq
                </p>


                <input type="file"
                       id="file-input-single"
                       name="sql_files"
                       multiple
                       accept=".sql,.bteq"
                       hidden>


                <div id="single-file-list"
                     class="mini-file-list"></div>


                <button type="button"
                        class="btn-glass"
                        onclick="document.getElementById('file-input-single').click()">

                    Browse Files

                </button>

            </div>



            <!-- ZIP UPLOAD -->
            <div class="bento-item upload-zone">

                <div class="upload-icon">
                    📦
                </div>

                <h4>
                    Batch ZIP Upload
                </h4>

                <p>
                    Upload ZIP containing SQL files
                </p>


                <input type="file"
                       id="file-input-zip"
                       name="zip_file"
                       accept=".zip"
                       hidden>


                <div id="zip-file-list"
                     class="mini-file-list"></div>


                <button type="button"
                        class="btn-glass"
                        onclick="document.getElementById('file-input-zip').click()">

                    Select ZIP

                </button>

            </div>

        </div>



        <!-- ACTION FOOTER -->
        <footer class="action-footer">


            <button id="start-btn"
                    class="btn-primary-mega"
                    disabled>

                <span>
                    Start SQL Script Conversion Engine
                </span>

                <div class="btn-glow"></div>



            <div id="progress-status"
                 class="progress-text">
            </div>



            <div class="progress-container">

                <div id="progress-bar"
                     class="progress-bar">
                </div>

            </div>


        </footer>



    </main>


</div>



<!-- SCRIPT -->
<script src="{{ url_for('static', filename='script.js') }}"
        defer>
</script>


</body>

</html>
