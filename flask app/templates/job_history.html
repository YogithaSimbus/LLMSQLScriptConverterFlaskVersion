<!DOCTYPE html>
<html>
<head>
    <title>Job History</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="glass-bg"></div>

<!-- HEADER -->
<header class="main-header">
    <div class="logo-area">
        <div class="logo-label">Databricks</div>
    </div>
    <div class="brand-area">
        <div>
            <h1 class="hero-title">Job Run History</h1>
            <div class="sub-header">
                Job Name – <span class="job-name">lakebridge-switch-transpiler</span>
            </div>
        </div>
    </div>
    <div class="header-actions">
        <a href="{{ url_for('migration_report') }}" class="btn-glass back-btn">
            ← Back to Dashboard
        </a>
    </div>
</header>

<div class="bento-grid">

    <div class="bento-item">

        <div class="panel-header">
            Recent Pipeline Executions
        </div>
        <div class="pagination">
            <button onclick="prevPage()" class="btn-glass">← Prev</button>
            <span id="pageInfo"></span>
            <button onclick="nextPage()" class="btn-glass">Next →</button>
        </div>

        <div class="table-wrapper">
            <table class="modern-table" id="jobTable">
                <thead>
                    <tr>
                        <th>Run ID</th>
                        <th>Status</th>
                        <th>Start Time</th>
                        <th>Duration (sec)</th>
                        <th>Output</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

    </div>

</div>

<script>

let allRuns = [];
let currentPage = 1;
const rowsPerPage = 10;

async function loadJobHistory() {

    const response = await fetch("/api/job-history?limit=100");
    allRuns = await response.json();

    renderTable();
}

function renderTable() {

    const tableBody = document.querySelector("#jobTable tbody");
    tableBody.innerHTML = "";

    const start = (currentPage - 1) * rowsPerPage;
    const end = start + rowsPerPage;
    const pageData = allRuns.slice(start, end);

    pageData.forEach(run => {

        const row = document.createElement("tr");

        let statusClass = "review";
        if (run.status === "SUCCESS") statusClass = "pass";
        if (run.status === "FAILED") statusClass = "fail";

        row.innerHTML = `
            <td>${run.run_id}</td>
            <td>
                <span class="status-badge ${statusClass}">
                    ${run.status}
                </span>
            </td>
            <td>${run.start_time}</td>
            <td>${run.duration}</td>
            <td>
                ${
                    run.output_link
                    ?
                    `<a class="btn-glass" href="${run.output_link}" target="_blank">
                        Open Folder
                     </a>`
                    :
                    `<span style="color: var(--text-dim)">Not Available</span>`
                }
            </td>
        `;

        tableBody.appendChild(row);
    });

    updatePaginationInfo();
}

function nextPage() {
    if (currentPage < Math.ceil(allRuns.length / rowsPerPage)) {
        currentPage++;
        renderTable();
    }
}

function prevPage() {
    if (currentPage > 1) {
        currentPage--;
        renderTable();
    }
}

function updatePaginationInfo() {
    const totalPages = Math.ceil(allRuns.length / rowsPerPage);
    document.getElementById("pageInfo").innerText =
        `Page ${currentPage} of ${totalPages}`;
}

loadJobHistory();

</script>

</body>
</html>
