<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Migration Report • SQLSwitch</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body data-theme="dark">

<div class="glass-bg"></div>

<div class="app-shell">

<header class="main-header">

<div class="logo-area">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/63/Databricks_Logo.png">
<span class="logo-label">Migration Dashboard</span>
</div>

<div class="brand-area">

<h1 class="hero-title">
Migration Report
</h1>

<div class="header-actions">

<button onclick="window.location.href='/'" class="btn-glass">
← New Run
</button>


<button onclick="window.location.href='/job-history'" class="btn-glass">
    Job History
</button>

<div class="user-status success">
Completed
</div>

</div>
</div>
</header>


<main class="report-shell">

<!-- METRICS -->
<section class="metrics-row">

<div class="metric-card">
<div class="metric-label">Average Accuracy</div>
<div class="metric-value" id="avg-accuracy">--</div>
<div class="metric-bar">
<div id="avg-bar"></div>
</div>
</div>

<div class="metric-card">
<div class="metric-label">Files Passed</div>
<div class="metric-value" id="passed-files">--</div>
</div>

<div class="metric-card">
<div class="metric-label">Total Files</div>
<div class="metric-value" id="total-files">--</div>
</div>

</section>


<!-- MAIN GRID -->
<section class="report-grid">

<!-- FILE LIST -->
<div class="file-explorer">

<div class="panel-header">
Files
</div>

<div id="file-list" class="file-list"></div>

</div>


<!-- INSPECTOR -->
<div class="inspector">

    <!-- FIXED HEADER -->
    <div class="inspector-header-fixed">

        <div class="file-info">
            <div id="selected-file-name" class="file-title">
                Select a file
            </div>

            <div id="selected-status" class="status-badge">
                -
            </div>
        </div>

        <div class="accuracy-ring-container">

            <svg class="progress-ring" width="120" height="120">

                <circle
                    class="ring-bg"
                    cx="60"
                    cy="60"
                    r="52"
                    stroke-width="8"
                    fill="transparent"
                />

                <circle
                    class="ring-progress"
                    cx="60"
                    cy="60"
                    r="52"
                    stroke-width="8"
                    fill="transparent"
                    stroke-linecap="round"
                    transform="rotate(-90 60 60)"
                />

            </svg>

            <div class="ring-center">
                <div id="accuracy-number" class="ring-value">0%</div>
                <div class="ring-label">Accuracy</div>
            </div>

        </div>


    </div>


    <!-- SCROLLABLE BODY -->
    <div class="inspector-body-scroll">

        <div class="tabs">

            <button class="tab-btn active" onclick="showTab(event,'legacy')">
            Legacy SQL
            </button>

            <button class="tab-btn" onclick="showTab(event,'converted')">
            Converted SQL
            </button>

            <button class="tab-btn" onclick="showTab(event,'errors')">
            Errors
            </button>


        </div>


        <div class="tab-content">

            <pre id="legacy-tab" class="sql-box active"></pre>

            <pre id="converted-tab" class="sql-box"></pre>

            <pre id="errors-tab" class="sql-box"></pre>

        </div>

    </div>

</div>


</section>

</main>

</div>



<script>

let reportData = null;
let selectedIndex = null;


function getStatusClass(status){

if(status==="Pass") return "pass";
if(status==="Needs Review") return "review";
return "fail";

}


function showTab(event, tab){

document.querySelectorAll(".tab-btn")
.forEach(btn=>btn.classList.remove("active"));

document.querySelectorAll(".sql-box")
.forEach(box=>box.classList.remove("active"));

event.target.classList.add("active");

document.getElementById(tab+"-tab")
.classList.add("active");

}



function selectFile(index){

selectedIndex = index;

const file = reportData.files[index];
if(!file) return;

console.log("Selected file:", file);

document.getElementById("selected-file-name").innerText =
file.file_name || "Unknown file";

const status = document.getElementById("selected-status");
status.innerText = file.status || "Unknown";
status.className = "status-badge " + getStatusClass(file.status);

const accuracy = file.accuracy || 0;
animateAccuracy(accuracy);

// Update legacy SQL tab
document.getElementById("legacy-tab").innerText =
  file.legacy_sql || "No legacy SQL available";

// Update errors tab
document.getElementById("errors-tab").innerText =
  file.errors || "No errors";

// Update converted SQL tab
if ((file.errors && file.errors.length > 0) || (file.accuracy && file.accuracy < 100)) {
  document.getElementById("converted-tab").innerText =
    "No converted output generated, please check the errors tab for more info";
} else {
  document.getElementById("converted-tab").innerText =
    file.converted_sql || "No converted SQL available";
}


document.querySelectorAll(".file-item")
.forEach(el=>el.classList.remove("active"));

document.querySelectorAll(".file-item")[index]
?.classList.add("active");

}



function populateFileList(){

const container = document.getElementById("file-list");
container.innerHTML = "";

if(!reportData.files || reportData.files.length === 0){
container.innerHTML = "<div style='padding:20px'>No files found</div>";
return;
}

reportData.files.forEach((file,index)=>{

const accuracy = file.accuracy || 0;
const status = file.status || "Fail";

const div = document.createElement("div");
div.className = "file-item";
div.onclick = ()=>selectFile(index);

div.innerHTML = `
<div class="file-left">
<div class="status-dot ${getStatusClass(status)}"></div>
<div class="file-name">${file.file_name}</div>
</div>
<div class="file-right">
<div class="file-accuracy">${accuracy}%</div>
</div>
`;

container.appendChild(div);

});

}



async function loadReport(){

try {

const res = await fetch("/api/migration_report");
const raw = await res.json();

console.log("API RESPONSE:", raw);

// normalize structure safely
reportData = {
files: raw.files || raw.data || [],
metrics: raw.metrics || {
avg_accuracy: 0,
passed: 0,
total: 0
}
};

document.getElementById("avg-accuracy").innerText =
(reportData.metrics.avg_accuracy || 0) + "%";

document.getElementById("passed-files").innerText =
reportData.metrics.passed || 0;

document.getElementById("total-files").innerText =
reportData.metrics.total || 0;

document.getElementById("avg-bar").style.width =
(reportData.metrics.avg_accuracy || 0) + "%";

populateFileList();

// initialize ring safely
const circle = document.querySelector(".ring-progress");
if(circle){
const radius = 52;
const circumference = 2 * Math.PI * radius;

circle.style.strokeDasharray = circumference;
circle.style.strokeDashoffset = circumference;
}

if(reportData.files.length > 0)
selectFile(0);

} catch (err) {
console.error("LOAD REPORT ERROR:", err);
}

}

function animateAccuracy(value){

const circle = document.querySelector(".ring-progress");
const element = document.getElementById("accuracy-number");

if(!circle || !element) return;   // prevents crash

const radius = 52;
const circumference = 2 * Math.PI * radius;

circle.style.strokeDasharray = circumference;

const offset =
circumference - (value / 100) * circumference;

circle.style.strokeDashoffset = offset;


// number animation
let current = 0;
const step = value / 40;

const interval = setInterval(() => {

current += step;

if(current >= value){
current = value;
clearInterval(interval);
}

element.innerText = current.toFixed(1) + "%";

}, 20);

}

loadReport();

</script>

</body>
</html>
